repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [ --fix, --exit-zero ]
      - id: ruff-format

  - repo: local
    hooks:
        - id: frontend-eslint
          name: eslint
          entry: bash -c 'cd easyhome-frontend && npx eslint src/**/*.{js,jsx} --config eslint.config.js'
          language: system
          files: ^easyhome-frontend/src/
          pass_filenames: false
