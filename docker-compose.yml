version: '3.8'

services:
  backend:
    build: ./easyhome-backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    environment:
      # SQLite para datos sintéticos (sin PostgreSQL)
      - DATABASE_URL=sqlite:////app/data/easyhome.db
      - DB_NAME=easyhome
      - SECRET_KEY=una_clave_muy_secreta_aqui_cambiar_en_produccion
      - JWT_SECRET_KEY=otra_clave_para_los_tokens_cambiar_en_produccion
      - DEBUG=True
      - AWS_REGION=us-east-1
    volumes:
      # Persiste los datos en un volumen de Docker
      - backend_data:/app/data
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: ./easyhome-frontend
    container_name: react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
